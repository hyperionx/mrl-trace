[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mrl-trace"
version = "0.1.0"
description = "A Memristive Device Transient as a Hardware Eligibility Trace for Three-Factor Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "torch",
    "snntorch",
]

[tool.setuptools.packages.find]
where = ["src"]
